name: Build and Release Packages

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}-${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version:
          # Router is DISTRIB_RELEASE='SNAPSHOT' -> the .apk must be built against
          # the *current* snapshot ABI (libubox20260721 etc.), not 25.12's 20260213.
          - SNAPSHOT

          # Add '25.12.2' here ONLY if you reflash to a release image first.
          # Each version pulls its own SDK image (~5-10 min), and the two builds
          # produce files with the same package name -> the version is therefore
          # baked into the dist filename below to avoid clobbering on release.

        arch:
          # NETGEAR R7450 (MT7621AT, ramips/mt7621) -> DISTRIB_ARCH='mipsel_24kc'
          - mipsel_24kc

          # NOTE: mipsel_24kc_24kf is a *different* arch (FPU variant). It builds
          # fine but the .apk will not install on the R7450.

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # gh-action-sdk needs full history

      - name: Build with OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.version }}
          FEEDNAME: action      # output path: bin/packages/mipsel_24kc/action/
          PACKAGES: darkmoon    # build ONLY darkmoon; see note below
          IGNORE_ERRORS: 0
          # V: s               # uncomment for full verbose build logs
          # NO_SHFMT_CHECK: 'true'   # only if the init-script format check trips

      - name: Collect Packages
        run: |
          mkdir -p dist

          # Find packages with "darkmoon" and copy them with arch+version prefix
          for file in $(find bin/packages/ -type f \( -name "*darkmoon*.apk" -o -name "*darkmoon*.ipk" \)); do
            filename=$(basename "$file")
            cp "$file" "dist/${{ matrix.version }}_${{ matrix.arch }}_${filename}"
          done

          echo "--- collected ---"
          ls -l dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darkmoon-${{ matrix.arch }}-${{ matrix.version }}
          path: dist/*
          if-no-files-found: error

      - name: Add to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
